[package]
name = "locio"
version = "0.1.0"
edition = "2021"
description = "A powerful CLI tool to count lines and files in directories with extensive filtering options"
authors = ["Toufiq Hasan Kiron <hello@kiron.dev>"]
license = "MIT"
repository = "https://github.com/kiron0/locio"
homepage = "https://github.com/kiron0/locio"

[lib]
name = "locio"
path = "src/lib.rs"

[[bin]]
name = "locio"
path = "src/main.rs"

[[bin]]
name = "lc"
path = "src/bin/lc.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
ignore = "0.4"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
